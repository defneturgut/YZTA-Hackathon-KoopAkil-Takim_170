# Single nginx vhost in front of the Aegis-KOBI stack.
#
# - Static frontend (Next.js) is reverse-proxied from port 3000.
# - REST API + WebSocket calls live under /api and /ws — forwarded to the
#   FastAPI backend on port 8000.
# - Strict security headers and a small in-memory rate-limit zone protect the
#   API from accidental floods during demos.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=aegis_api:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # ---- Security headers --------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---- API & WebSocket → FastAPI ----------------------------------------
    location /api/ {
        limit_req zone=aegis_api burst=40 nodelay;
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location /ws/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    # ---- Static frontend → Next.js ----------------------------------------
    location / {
        proxy_pass         http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
